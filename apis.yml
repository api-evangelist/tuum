description: >-
  Tuum is a cloud-native, modular core banking platform that lets banks,
  fintechs, and other financial institutions launch and modernise financial
  products without legacy constraints. Its API-first platform is organised into
  independent modules — accounts, payments, cards, lending, deposits, and more —
  covering Banking-as-a-Service, payments processing, lending, and Islamic
  banking. Developers integrate over per-module REST APIs (auth-api, person-api,
  account-api, payment-api, card-api, loan-api, deposit-api, notification-api),
  authenticating with a JWT presented in the x-auth-token header (with a
  standards OAuth 2.0 authorization server also available), and receive
  near-real-time events via the Notification API's webhooks. Founded in Estonia
  (formerly Modularbank), Tuum is backed by investors including Speedinvest.
